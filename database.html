<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>基礎資料庫 | 家庭財務</title>
  <link rel="preconnect" href="https://unpkg.com" crossorigin>
  <link rel="stylesheet" href="./css/theme.css">
  <link rel="stylesheet" href="./css/layout.css">
  <link rel="stylesheet" href="./css/components.css">
  <link rel="stylesheet" href="./css/utilities.css">
</head>
<body>
  <div class="app-shell">
    <aside id="sidebar-root"></aside>
    <div class="main-area">
      <header id="navbar-root"></header>
      <main class="content content-min-height">
        <div class="page-header">
          <h1 class="page-title">基礎資料庫</h1>
          <p class="page-subtitle">管理基礎資料與選項</p>
        </div>

        <div id="db-tab-bar-root"></div>
        <div id="db-panel-members" class="tab-panel" style="display:none;"></div>
        <div id="db-panel-banks" class="tab-panel" style="display:none;"></div>
        <div id="db-panel-categories" class="tab-panel" style="display:none;"></div>
        <div id="db-panel-options" class="tab-panel" style="display:none;"></div>
        <div id="db-panel-dropdowns" class="tab-panel" style="display:none;"></div>
        <div id="db-panel-yearrange" class="tab-panel" style="display:none;"></div>
      </main>
    </div>
  </div>

  <script src="https://unpkg.com/lucide@0.462.0/dist/umd/lucide.min.js" defer></script>

  <link rel="modulepreload" href="./js/layout/app-shell.js">
  <link rel="modulepreload" href="./js/engines/page-engine.js">
  <link rel="modulepreload" href="./js/pages/database.js">

  <script type="module">
    import { initApp } from './js/layout/app-shell.js';
    import { createPage } from './js/engines/page-engine.js';
    import schema from './js/pages/database.js';

    const user = await initApp({ activeHref: 'database.html', title: '基礎資料庫' });
    if (user) {
      await createPage(schema);
    }
  </script>
</body>
</html>
