<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>成員管理 | 家庭財務</title>
  <link rel="stylesheet" href="./css/theme.css">
  <link rel="stylesheet" href="./css/layout.css">
  <link rel="stylesheet" href="./css/components.css">
  <link rel="stylesheet" href="./css/utilities.css">
</head>
<body>
  <div class="app-shell">
    <aside id="sidebar-root"></aside>
    <div class="main-area">
      <header id="navbar-root"></header>

      <main class="content content-min-height">
        <div class="page-header flex flex-between items-end flex-wrap gap-12">
          <div>
            <h1 class="page-title">成員管理</h1>
            <p class="page-subtitle">家庭成員清單（唯讀）· 管理請至基礎資料庫</p>
          </div>
          <div class="flex items-center gap-12 flex-wrap">
            <div id="view-toggle-root"></div>
            <button class="btn btn-primary" id="manage-members-btn">
              <i data-lucide="settings"></i> 管理成員
            </button>
          </div>
        </div>

        <!-- 卡片模式 -->
        <div id="members-card-view"></div>

        <!-- 表格模式 -->
        <div id="members-table-view" style="display:none;"></div>

        <!-- 快速摘要 -->
        <div id="quick-summary-root"></div>

        <!-- 隱藏：成員數量提示 -->
        <div id="members-count" style="display:none;"></div>
      </main>
    </div>
  </div>

  <script src="https://unpkg.com/lucide@latest"></script>
  <script type="module">
    import { initApp } from './js/core/app.js';
    import { initMembersPage } from './js/pages/members.js';

    await initApp({ activeHref: 'members.html', title: '成員管理' });
    initMembersPage();
  </script>
</body>
</html>
