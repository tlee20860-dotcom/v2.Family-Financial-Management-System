<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>銀行管理 | 家庭財務</title>
  <link rel="stylesheet" href="./css/theme.css">
  <link rel="stylesheet" href="./css/layout.css">
  <link rel="stylesheet" href="./css/components.css">
  <link rel="stylesheet" href="./css/utilities.css">
</head>
<body>
  <div class="app-shell">
    <aside id="sidebar-root"></aside>
    <div class="main-area">
      <header id="navbar-root"></header>

      <main class="content content-min-height">
        <div class="page-header flex flex-between items-end flex-wrap gap-12">
          <div>
            <h1 class="page-title">銀行管理</h1>
            <p class="page-subtitle" id="banks-month">每月結餘總覽</p>
          </div>
          <div class="flex items-center gap-12 flex-wrap">
            <div id="view-toggle-root"></div>
            <div class="view-toggle-group" id="banks-mode-toggle">
              <button class="btn btn-sm btn-ghost" id="view-month-btn">單月</button>
              <button class="btn btn-sm btn-primary" id="view-annual-btn">全年</button>
            </div>
            <button class="btn btn-primary" id="go-input-center-btn">
              <i data-lucide="plus"></i> 前往輸入中心
            </button>
          </div>
        </div>

        <div id="page-filter-root" class="mb-16"></div>

        <!-- ============ 單月檢視 ============ -->
        <div id="banks-summary-view">
          <!-- 統計卡 -->
          <div class="grid grid-2 mb-20">
            <div class="glass-card">
              <div class="glass-card-title">本月銀行總結餘</div>
              <div class="glass-card-value emerald mono" id="bank-total">HK$ 0</div>
              <div class="glass-card-hint" id="bank-count"></div>
            </div>
            <div class="glass-card">
              <div class="glass-card-title">上月結餘</div>
              <div class="glass-card-value cyan mono" id="bank-available">HK$ 0</div>
              <div class="glass-card-hint">做為本月支出對照</div>
            </div>
          </div>

          <!-- 卡片模式 -->
          <div id="banks-card-view"></div>

          <!-- 表格模式 -->
          <div id="banks-table-view" style="display:none;"></div>
        </div>

        <!-- ============ 全年檢視 ============ -->
        <div id="banks-annual-view" style="display:none;">
          <div class="glass-card mb-20">
            <div class="glass-card-title">年末銀行總結餘</div>
            <div class="glass-card-value emerald mono" id="annual-bank-total">HK$ 0</div>
            <div class="glass-card-hint">以該年度最後一個有紀錄的月份為準</div>
          </div>

          <div id="annual-monthly-cards"></div>
        </div>

        <!-- 快速摘要 -->
        <div id="quick-summary-root"></div>
      </main>
    </div>
  </div>

  <script src="https://unpkg.com/lucide@latest"></script>
  <script type="module">
    import { initApp } from './js/core/app.js';
    import { initBanksPage } from './js/pages/banks.js';

    await initApp({ activeHref: 'banks.html', title: '銀行管理' });
    initBanksPage();
  </script>
</body>
</html>
