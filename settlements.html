<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>結算清單 | 家庭財務</title>
  <link rel="preconnect" href="https://unpkg.com" crossorigin>
  <link rel="stylesheet" href="./css/theme.css">
  <link rel="stylesheet" href="./css/layout.css">
  <link rel="stylesheet" href="./css/components.css">
  <link rel="stylesheet" href="./css/utilities.css">
</head>
<body>
  <div class="app-shell">
    <aside id="sidebar-root"></aside>
    <div class="main-area">
      <header id="navbar-root"></header>
      <main class="content content-min-height">
        <div class="page-header flex flex-between items-end flex-wrap gap-12">
          <div>
            <h1 class="page-title">結算清單</h1>
            <p class="page-subtitle" id="settlement-month"></p>
          </div>
          <select class="select" id="settlement-sort" style="width:auto; padding:8px 12px;">
            <option value="pending-first">未處理置頂</option>
            <option value="date-desc">日期（新→舊）</option>
            <option value="date-asc">日期（舊→新）</option>
            <option value="amount-desc">金額（大→小）</option>
          </select>
        </div>

        <div class="banner mb-16">
          ℹ️ 整合「個人支出 / 家庭共用支出 / 保險扣款」三大來源。
        </div>

        <div id="page-filter-root" class="mb-16"></div>
        <div id="settlement-stats-root"></div>
        <div id="settlement-table-root"></div>
      </main>
    </div>
  </div>

  <script src="https://unpkg.com/lucide@0.462.0/dist/umd/lucide.min.js" defer></script>

  <!-- 🆕 vConsole（inline，100% 有效） -->
  <script src="https://cdn.jsdelivr.net/npm/vconsole@3.15.0/dist/vconsole.min.js"></script>
  <script>
    window.__vconsole_loaded__ = true;
    window.vConsole = new window.VConsole({ maxLogNumber: 2000 });
    window.addEventListener('error', (e) => {
      console.error('[GLOBAL ERROR]', e.message, e.filename, e.lineno);
    });
    window.addEventListener('unhandledrejection', (e) => {
      console.error('[UNHANDLED]', e.reason);
    });
    console.log('[settlements.html] inline vConsole 已載入');
  </script>

  <script type="module">
    console.log('[settlements.html] 開始載入模組');
    try {
      const { initApp } = await import('./js/layout/app-shell.js');
      const { createPage } = await import('./js/engines/page-engine.js');
      const schema = (await import('./js/pages/settlements.js')).default;
      console.log('[settlements.html] 模組載入完成');

      const user = await initApp({ activeHref: 'settlements.html', title: '結算清單' });
      console.log('[settlements.html] initApp 完成：', user ? 'OK' : 'NULL');

      if (user) {
        const page = await createPage(schema);
        console.log('[settlements.html] createPage 完成');
      }
    } catch (err) {
      console.error('[settlements.html] 載入失敗：', err.message, err.stack);
    }
  </script>
</body>
</html>
