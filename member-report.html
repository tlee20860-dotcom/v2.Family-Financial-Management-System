<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>成員與家庭收入與支出明細 | 家庭財務</title>
  <link rel="stylesheet" href="./css/theme.css">
  <link rel="stylesheet" href="./css/layout.css">
  <link rel="stylesheet" href="./css/components.css">
  <link rel="stylesheet" href="./css/utilities.css">
</head>
<body>
  <div class="app-shell">
    <aside id="sidebar-root"></aside>
    <div class="main-area">
      <header id="navbar-root"></header>

      <main class="content content-min-height">
        <div class="page-header">
          <h1 class="page-title">成員與家庭收入與支出明細</h1>
          <p class="page-subtitle" id="member-report-subtitle">載入中…</p>
        </div>

        <!-- 年份選擇器 -->
        <div id="page-filter-root" class="mb-16"></div>

        <!-- 統計卡 -->
        <div id="member-report-stats-root"></div>

        <!-- 成員清單區塊 -->
        <div class="glass-card collapsible-card collapsible-card-flat" style="padding:0; margin-bottom:20px;">
          <div class="collapsible-header">
            <div class="collapsible-header-title">
              <i data-lucide="users" style="width:16px;height:16px;"></i>
              <span>成員清單</span>
            </div>
          </div>
          <div class="collapsible-body" style="display:block;">
            <div id="member-list-root"></div>
          </div>
        </div>

        <!-- 明細區塊 -->
        <div class="glass-card collapsible-card collapsible-card-flat" style="padding:0;" id="member-detail-card">
          <div class="collapsible-header">
            <div class="collapsible-header-title">
              <i data-lucide="file-text" style="width:16px;height:16px;"></i>
              <span id="member-detail-title">明細</span>
            </div>
          </div>
          <div class="collapsible-body" style="display:block;">
            <div id="member-detail-root"></div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="https://unpkg.com/lucide@latest"></script>
  <script type="module">
    import { initApp } from './js/core/app.js';
    import { initMemberReportPage } from './js/pages/member-report.js';

    await initApp({ activeHref: 'member-report.html', title: '成員與家庭收入與支出明細' });
    await initMemberReportPage();
  </script>
</body>
</html>
