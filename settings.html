<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>系統設定 | 家庭財務</title>
  <link rel="stylesheet" href="./css/theme.css">
  <link rel="stylesheet" href="./css/layout.css">
  <link rel="stylesheet" href="./css/components.css">
  <link rel="stylesheet" href="./css/utilities.css">
</head>
<body>
  <div class="app-shell">
    <aside id="sidebar-root"></aside>
    <div class="main-area">
      <header id="navbar-root"></header>

      <main class="content content-min-height">
        <div class="page-header">
          <h1 class="page-title">系統設定</h1>
          <p class="page-subtitle">平台設定與個人化</p>
        </div>

        <div id="settings-tabs"></div>

        <!-- 平台設定 Panel（superadmin 專用） -->
        <div id="settings-panel-platform" class="tab-panel" style="display:none;">
          <div class="banner mb-16">
            ℹ️ 平台 UI 常數為全站預設值，家庭可在「基礎資料庫 → 下拉選項」中覆蓋。
          </div>

          <div class="glass-card" style="max-width:640px;">
            <div class="glass-card-title" style="display:flex; align-items:center; gap:8px; margin-bottom:16px;">
              <i data-lucide="settings" style="width:16px;height:16px;color:var(--neon-cyan);"></i>
              <span>UI 常數</span>
            </div>

            <div id="settings-platform-form-root"></div>
          </div>

          <div class="banner mt-16" style="max-width:640px;">
            💡 平台「預設資料庫」的編輯請至 <a href="admin.html" style="color:var(--neon-cyan);">平台管理</a> 頁面。
          </div>
        </div>

        <!-- 個人化 Panel -->
        <div id="settings-panel-personal" class="tab-panel" style="display:none;">
          <div class="grid grid-2" style="gap:16px; align-items:start;">

            <!-- 帳號資訊 -->
            <div class="glass-card">
              <div class="glass-card-title" style="display:flex; align-items:center; gap:8px; margin-bottom:16px;">
                <i data-lucide="user" style="width:16px;height:16px;color:var(--neon-cyan);"></i>
                <span>帳號資訊</span>
              </div>

              <div class="form-stack">
                <div class="field">
                  <label class="field-label">登入帳號</label>
                  <input class="input mono" id="settings-account" value="" disabled>
                </div>
                <div class="field">
                  <label class="field-label">角色</label>
                  <input class="input mono" id="settings-role" value="" disabled>
                </div>
                <div class="field">
                  <label class="field-label">家庭名稱</label>
                  <input class="input" id="settings-family" value="" disabled>
                </div>
              </div>

              <div style="margin-top:16px; padding-top:16px; border-top:1px dashed rgba(255,255,255,0.08); text-align:right;">
                <button type="button" class="btn btn-danger" id="settings-logout-btn">
                  <i data-lucide="log-out"></i> 登出
                </button>
              </div>
            </div>

            <!-- 🆕 v101.7.2：統計卡顯示模式 -->
            <div class="glass-card">
              <div class="glass-card-title" style="display:flex; align-items:center; gap:8px; margin-bottom:16px;">
                <i data-lucide="bar-chart-2" style="width:16px;height:16px;color:var(--neon-cyan);"></i>
                <span>統計卡顯示模式</span>
              </div>

              <p class="glass-card-hint mb-16">
                調整頁面頂部統計卡的顯示樣式
              </p>

              <div id="stats-mode-options" style="display:flex; flex-direction:column; gap:8px;">
                <label class="stats-mode-option" data-value="auto">
                  <input type="radio" name="stats-mode" value="auto" style="margin-right:10px; cursor:pointer;">
                  <div style="flex:1; cursor:pointer;">
                    <div style="font-size:13px; font-weight:500;">自動（預設）</div>
                    <div style="font-size:11px; color:var(--text-muted); margin-top:2px;">
                      手機一律緊湊、桌面跟隨表格 / 卡片模式
                    </div>
                  </div>
                </label>

                <label class="stats-mode-option" data-value="integrated">
                  <input type="radio" name="stats-mode" value="integrated" style="margin-right:10px; cursor:pointer;">
                  <div style="flex:1; cursor:pointer;">
                    <div style="font-size:13px; font-weight:500;">整合（單卡內部分隔）</div>
                    <div style="font-size:11px; color:var(--text-muted); margin-top:2px;">
                      所有統計合併成一張大卡，節省垂直空間
                    </div>
                  </div>
                </label>

                <label class="stats-mode-option" data-value="compact">
                  <input type="radio" name="stats-mode" value="compact" style="margin-right:10px; cursor:pointer;">
                  <div style="flex:1; cursor:pointer;">
                    <div style="font-size:13px; font-weight:500;">緊湊（獨立卡片 2x2）</div>
                    <div style="font-size:11px; color:var(--text-muted); margin-top:2px;">
                      獨立小卡片，視覺衝擊大
                    </div>
                  </div>
                </label>
              </div>

              <div style="margin-top:16px; padding-top:16px; border-top:1px dashed rgba(255,255,255,0.08); text-align:right;">
                <button type="button" class="btn btn-primary" id="save-stats-mode-btn">
                  <i data-lucide="check" style="width:14px;height:14px;"></i>
                  儲存顯示模式
                </button>
              </div>
            </div>

            <!-- 側邊欄排序 -->
            <div class="glass-card" style="grid-column: span 2;">
              <div class="glass-card-title" style="display:flex; align-items:center; gap:8px; margin-bottom:16px;">
                <i data-lucide="list-ordered" style="width:16px;height:16px;color:var(--neon-cyan);"></i>
                <span>側邊欄排序</span>
              </div>

              <p class="glass-card-hint mb-16">
                調整功能選單的顯示順序（同步至雲端，跨裝置生效）
              </p>

              <div id="sidebar-order-list"></div>

              <div style="margin-top:16px; text-align:right;">
                <button type="button" class="btn btn-ghost btn-sm" id="reset-sidebar-order-btn">
                  <i data-lucide="rotate-ccw" style="width:14px;height:14px;"></i>
                  重置為預設
                </button>
              </div>
            </div>

          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="https://unpkg.com/lucide@latest"></script>
  <script type="module">
    import { initApp } from './js/core/app.js';
    import { initSettingsPage } from './js/pages/settings.js';

    await initApp({ activeHref: 'settings.html', title: '系統設定' });
    await initSettingsPage();
  </script>
</body>
</html>
