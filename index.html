<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>總覽儀表板 | 家庭財務</title>
  <link rel="stylesheet" href="./css/theme.css">
  <link rel="stylesheet" href="./css/layout.css">
  <link rel="stylesheet" href="./css/components.css">
  <link rel="stylesheet" href="./css/utilities.css">
</head>
<body>
  <div class="app-shell">
    <aside id="sidebar-root"></aside>
    <div class="main-area">
      <header id="navbar-root"></header>

      <main class="content content-min-height">
        <div class="page-header flex flex-between items-end flex-wrap gap-12">
          <div>
            <h1 class="page-title">總覽儀表板</h1>
            <p class="page-subtitle" id="dashboard-subtitle">載入中…</p>
          </div>
          <a class="btn btn-primary" href="annual-report.html">
            <i data-lucide="bar-chart-3"></i> 查看年度報表
          </a>
        </div>

        <div id="dashboard-error" class="banner banner-magenta" style="display:none;"></div>

        <!-- 統計卡（當前年度） -->
        <div id="stats-cards-root"></div>

        <!-- 年度清單（前後 2 年） -->
        <div class="glass-card collapsible-card collapsible-card-flat" style="padding:0;">
          <div class="collapsible-header">
            <div class="collapsible-header-title">
              <i data-lucide="calendar" style="width:16px;height:16px;"></i>
              <span>年度總覽（前後 2 年）</span>
            </div>
          </div>
          <div class="collapsible-body" style="display:block;">
            <div id="annual-table-root"></div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="https://unpkg.com/lucide@latest"></script>
  <script type="module">
    import { initApp } from './js/core/app.js';
    import { initDashboardPage } from './js/pages/dashboard.js';

    await initApp({ activeHref: 'index.html', title: '總覽儀表板' });
    await initDashboardPage();
  </script>
</body>
<script src="https://cdn.jsdelivr.net/npm/vconsole@latest/dist/vconsole.min.js"></script>
<script>
  var vconsole = new window.VConsole();
</script>
</html>
