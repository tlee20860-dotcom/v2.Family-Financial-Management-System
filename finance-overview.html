<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>財務總覽 | 家庭財務</title>
  <link rel="stylesheet" href="./css/theme.css">
  <link rel="stylesheet" href="./css/layout.css">
  <link rel="stylesheet" href="./css/components.css">
  <link rel="stylesheet" href="./css/utilities.css">
</head>
<body>
  <div class="app-shell">
    <aside id="sidebar-root"></aside>
    <div class="main-area">
      <header id="navbar-root"></header>

      <main class="content content-min-height">
        <div class="page-header">
          <h1 class="page-title">財務總覽</h1>
          <p class="page-subtitle" id="finance-month-label">載入中…</p>
        </div>

        <!-- 共用年月選擇器 -->
        <div id="page-filter-root" class="mb-16"></div>

        <!-- 統計卡 -->
        <div id="finance-stats-root"></div>

        <!-- 收入區塊 -->
        <div class="glass-card collapsible-card collapsible-card-flat" style="padding:0; margin-bottom:20px;">
          <div class="collapsible-header">
            <div class="collapsible-header-title">
              <i data-lucide="dollar-sign" style="width:16px;height:16px;"></i>
              <span>收入明細</span>
            </div>
          </div>
          <div class="collapsible-body" style="display:block;">
            <div id="income-section-root"></div>
          </div>
        </div>

        <!-- 銀行區塊 -->
        <div class="glass-card collapsible-card collapsible-card-flat" style="padding:0;">
          <div class="collapsible-header">
            <div class="collapsible-header-title">
              <i data-lucide="landmark" style="width:16px;height:16px;"></i>
              <span>銀行結餘明細</span>
            </div>
          </div>
          <div class="collapsible-body" style="display:block;">
            <div id="bank-section-root"></div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="https://unpkg.com/lucide@latest"></script>
  <script type="module">
    import { initApp } from './js/core/app.js';
    import { initFinanceOverviewPage } from './js/pages/finance-overview.js';

    await initApp({ activeHref: 'finance-overview.html', title: '財務總覽' });
    await initFinanceOverviewPage();
  </script>
</body>
</html>
