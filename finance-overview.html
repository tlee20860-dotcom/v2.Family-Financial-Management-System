<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>銀行交易 | 家庭財務</title>

  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://unpkg.com" crossorigin>
  <link rel="dns-prefetch" href="https://family-fin-a6dd1-default-rtdb.asia-southeast1.firebasedatabase.app">

  <style>
    :root{--bg-deep:#080B11;--bg-navy:#0F172A;--neon-cyan:#00F0FF;--neon-magenta:#D946EF;--neon-emerald:#10B981;--neon-red:#F43F5E;--glass-bg:rgba(15,23,42,0.6);--glass-border:rgba(0,240,255,0.2);--glass-blur:12px;--text-primary:#E2E8F0;--text-secondary:#94A3B8;--text-muted:#64748B;--radius-sm:6px;--font-sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC","Microsoft JhengHei","Noto Sans TC",sans-serif;--font-mono:"JetBrains Mono","SF Mono","Consolas","Menlo",monospace;--transition:0.25s cubic-bezier(0.4,0,0.2,1)}
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%;background:var(--bg-deep);color:var(--text-primary);font-family:var(--font-sans);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
    body::before{content:"";position:fixed;inset:0;background:radial-gradient(ellipse at 20% 0%,rgba(0,240,255,0.08),transparent 50%),radial-gradient(ellipse at 80% 100%,rgba(217,70,239,0.06),transparent 50%);pointer-events:none;z-index:0}
    a{color:var(--neon-cyan);text-decoration:none}
    button{font-family:inherit;cursor:pointer}
    .app-shell{display:flex;min-height:100vh;position:relative;z-index:1}
    .sidebar{width:260px;flex-shrink:0;background:rgba(8,11,17,0.85);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-right:1px solid var(--glass-border);display:flex;flex-direction:column;overflow:hidden}
    .sidebar-header{height:64px;display:flex;align-items:center;padding:0 20px;border-bottom:1px solid var(--glass-border);flex-shrink:0}
    .sidebar-logo{font-family:var(--font-mono);font-weight:700;font-size:16px;color:var(--neon-cyan);text-shadow:0 0 10px rgba(0,240,255,0.5);letter-spacing:1px}
    .sidebar-nav{flex:1;overflow-y:auto;padding:12px 0 24px}
    .main-area{flex:1;display:flex;flex-direction:column;min-width:0}
    .navbar{height:64px;flex-shrink:0;display:flex;align-items:center;gap:16px;padding:0 24px;background:rgba(8,11,17,0.7);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--glass-border);position:sticky;top:0;z-index:100}
    .navbar-title{font-size:16px;font-weight:600;color:var(--text-primary);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .content{flex:1;padding:24px;max-width:1400px;width:100%;margin:0 auto}
    .page-header{margin-bottom:24px}
    .page-title{font-size:24px;font-weight:700;color:var(--neon-cyan);text-shadow:0 0 20px rgba(0,240,255,0.3);margin-bottom:4px}
    .page-subtitle{font-size:13px;color:var(--text-muted)}
    .glass-card{background:var(--glass-bg);backdrop-filter:blur(var(--glass-blur));-webkit-backdrop-filter:blur(var(--glass-blur));border:1px solid var(--glass-border);border-radius:var(--radius-sm);padding:20px;transition:all var(--transition);position:relative;overflow:hidden}
    .btn{display:inline-flex;align-items:center;gap:6px;padding:9px 16px;font-size:14px;font-weight:500;border-radius:var(--radius-sm);border:1px solid var(--glass-border);background:rgba(0,240,255,0.05);color:var(--neon-cyan);transition:all var(--transition);white-space:nowrap;font-family:inherit;cursor:pointer}
    .btn-primary{background:rgba(0,240,255,0.15);border-color:rgba(0,240,255,0.5)}
    .flex{display:flex}
    .flex-between{display:flex;align-items:center;justify-content:space-between}
    .items-center{align-items:center}
    .items-end{align-items:flex-end}
    .flex-wrap{flex-wrap:wrap}
    .gap-12{gap:12px}
    .mb-16{margin-bottom:16px}
    .content-min-height{min-height:calc(100vh - 64px - 48px)}
    @media(max-width:640px){.sidebar{position:fixed!important;top:0!important;left:-260px!important;height:100vh!important;width:260px!important;z-index:10001!important;transition:left .3s ease!important}.sidebar.mobile-open{left:0!important}.content{padding:16px}.navbar{padding:0 12px;gap:8px}.navbar-title{display:none!important}}
  </style>

  <link rel="stylesheet" href="./css/theme.css" media="print" onload="this.media='all'">
  <link rel="stylesheet" href="./css/layout.css" media="print" onload="this.media='all'">
  <link rel="stylesheet" href="./css/components.css" media="print" onload="this.media='all'">
  <link rel="stylesheet" href="./css/utilities.css" media="print" onload="this.media='all'">
  <noscript>
    <link rel="stylesheet" href="./css/theme.css">
    <link rel="stylesheet" href="./css/layout.css">
    <link rel="stylesheet" href="./css/components.css">
    <link rel="stylesheet" href="./css/utilities.css">
  </noscript>
</head>
<body>
  <div class="app-shell">
    <aside id="sidebar-root"></aside>
    <div class="main-area">
      <header id="navbar-root"></header>

      <main class="content content-min-height">
        <div id="finance-overview-root"></div>
      </main>
    </div>
  </div>

  <script src="https://unpkg.com/lucide@0.462.0/dist/umd/lucide.min.js" defer></script>

  <link rel="modulepreload" href="./js/core/app.js">
  <link rel="modulepreload" href="./js/core/state.js">
  <link rel="modulepreload" href="./js/core/auth-guard.js">
  <link rel="modulepreload" href="./js/core/auth.js">
  <link rel="modulepreload" href="./js/core/api.js">
  <link rel="modulepreload" href="./js/core/db.js">
  <link rel="modulepreload" href="./js/core/pwa.js">
  <link rel="modulepreload" href="./js/config/firebase-config.js">
  <link rel="modulepreload" href="./js/config/app-config.js">
  <link rel="modulepreload" href="./js/config/constants.js">
  <link rel="modulepreload" href="./js/shared/sidebar.js">
  <link rel="modulepreload" href="./js/shared/navbar.js">
  <link rel="modulepreload" href="./js/shared/bank-helpers.js">
  <link rel="modulepreload" href="./js/shared/stats-cards.js">
  <link rel="modulepreload" href="./js/shared/data-table.js">
  <link rel="modulepreload" href="./js/pages/finance-overview.js">

  <script type="module">
    import { initApp } from './js/core/app.js';
    import { initFinanceOverviewPage } from './js/pages/finance-overview.js';

    const user = await initApp({ activeHref: 'finance-overview.html', title: '銀行交易' });
    if (user) {
      await initFinanceOverviewPage();
    }
  </script>
</body>
</html>
