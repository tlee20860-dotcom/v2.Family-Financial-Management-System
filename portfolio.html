<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>基金投資表 | 家庭財務</title>
  <link rel="stylesheet" href="./css/theme.css">
  <link rel="stylesheet" href="./css/layout.css">
  <link rel="stylesheet" href="./css/components.css">
  <link rel="stylesheet" href="./css/utilities.css">
</head>
<body>
  <div class="app-shell">
    <aside id="sidebar-root"></aside>
    <div class="main-area">
      <header id="navbar-root"></header>

      <main class="content content-min-height">
        <div class="page-header flex flex-between items-end flex-wrap gap-12">
          <div>
            <h1 class="page-title">基金投資表</h1>
            <p class="page-subtitle">基金持倉與最新現值</p>
          </div>
          <div class="flex items-center gap-12 flex-wrap">
            <div id="view-toggle-root"></div>
            <button class="btn btn-primary" id="add-fund-btn">
              <i data-lucide="plus"></i> 新增基金
            </button>
          </div>
        </div>

        <!-- 統計卡 -->
        <div id="portfolio-stats-root"></div>

        <!-- 卡片模式 -->
        <div id="fund-card-view"></div>

        <!-- 表格模式 -->
        <div id="fund-table-view" style="display:none;"></div>

        <!-- 空狀態 -->
        <div class="glass-card" id="fund-empty-state" style="display:none;">
          <div class="empty-state">
            <i data-lucide="line-chart" style="width:48px;height:48px;opacity:0.4;"></i>
            <p style="margin-top:12px;">尚無基金持倉</p>
            <button class="btn btn-primary" id="add-first-fund-btn" style="margin-top:12px;">
              <i data-lucide="plus"></i> 新增第一筆基金
            </button>
          </div>
        </div>

        <!-- 快速摘要（資產配置） -->
        <div id="quick-summary-root"></div>
      </main>
    </div>
  </div>

  <script src="https://unpkg.com/lucide@latest"></script>
  <script type="module">
    import { initApp } from './js/core/app.js';
    import { initPortfolioPage } from './js/pages/portfolio.js';

    await initApp({ activeHref: 'portfolio.html', title: '基金投資表' });
    await initPortfolioPage();
  </script>
</body>
</html>
